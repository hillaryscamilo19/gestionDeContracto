<div class="main-header">

  <header class="header">
    <div class="container">
      <h1>Gestion de Contrato</h1>
      <nav>
        <ul>
          <li><a routerLink="/configuracion" routerLinkActive="active">Configuración</a></li>
          <button class="btn btn-primary boton-Modal absolute top-0 right-0 size-16 " data-bs-toggle="modal"
            data-bs-target="#nuevoContratoModal">
            <i class="bi bi-plus-circle"></i>
          </button>
        </ul>
      </nav>
    </div>
  </header>


  <main class="main">
    <router-outlet></router-outlet>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; {{ currentYear }} Registro De Contracto {{ 'By:Hillarys' }} </p>
    </div>
    <!-- Modal para crear contrato -->
    <div class="modal fade" id="nuevoContratoModal" tabindex="-1" aria-labelledby="nuevoContratoModalLabel">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="nuevoContratoModalLabel">Nuevo Contrato</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form (ngSubmit)="crearContrato()">
              <!-- Información básica del contrato -->
              <div class="row mb-3">
                <div class="col-md-6">
                  <label for="numeroContrato" class="form-label">Número de Contrato *</label>
                  <input type="text" id="numeroContrato" name="numeroContrato" class="form-control"
                    [(ngModel)]="nuevoContrato.numeroContrato" required>
                </div>
                <div class="col-md-6">
                  <label for="clienteId" class="form-label">Cliente *</label>
                  <select id="clienteId" name="clienteId" class="form-select" [(ngModel)]="nuevoContrato.clienteId"
                    required>
                    <option [ngValue]="null" disabled>Seleccionar cliente</option>
                    <option *ngFor="let cliente of clientes" [ngValue]="cliente.id">
                      {{ cliente.name }}
                    </option>
                  </select>
                </div>
              </div>
              <!-- Tipo de contrato y propietario-->
              <div class="row mb-3">
                <div class="col-md-4">
                  <label for="tipoContrato" class="form-label">Tipo de Contrato *</label>
                  <select class="form-select" id="tipoContrato" name="tipoContrato"
                  [(ngModel)]="filtroTipoContrato" (change)="filtrarContratos()">
                  <option [ngValue]="null" disabled selected>Seleccionar</option>
                  <option *ngFor="let tipo of tiposContrato" [ngValue]="tipo.id">{{ tipo.descripcion }}</option>
                </select>
                </div>
                <div class="col-md-4">
                  <label for="empresaPropietario" class="form-label">Propietario del Contrato *</label>
                  <select class="form-select" id="empresaPropietario" name="empresaPropietario"
                  [(ngModel)]="filtroPropietario" (change)="cargarTipoServicios()">
                  <option [ngValue]="null" disabled selected>Seleccionar</option>
                  <option *ngFor="let empresa of servicio || []" [ngValue]="empresa.id">{{ empresa.descripcion }}</option>

                </select>
                </div>
                <div class="col-md-4">
                  <label for="tiposServicios" class="form-label">Servicios</label>
                  <select class="form-select" id="servicio" name="servicio"
                  [(ngModel)]="servicio" (change)="filtrarContratos()">
                  <option [ngValue]="null" disabled selected>Seleccionar</option>
                  <option *ngFor="let empresa of servicio" [ngValue]="empresa.id">{{ empresa.descripcion }}</option>
                </select>
                </div>
              </div>



              <!-- Fechas -->
              <div class="row mb-3">
                <div class="col-md-6">
                  <label for="creado" class="form-label">Fecha de Creación *</label>
                  <input type="date" id="creado" name="creado" class="form-control" [(ngModel)]="nuevoContrato.creado"
                    required>
                </div>
                <div class="col-md-6">
                  <label for="vencimiento" class="form-label">Fecha de Vencimiento *</label>
                  <input type="date" id="vencimiento" name="vencimiento" class="form-control"
                    [(ngModel)]="nuevoContrato.vencimiento" required>
                </div>
              </div>

              <!-- Descripción -->
              <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción *</label>
                <textarea id="descripcion" name="descripcion" class="form-control"
                  [(ngModel)]="nuevoContrato.descripcion" rows="3" required></textarea>
              </div>

              <!-- Archivo PDF -->
              <div class="mb-3">
                <label for="pdfInput" class="form-label">Adjuntar PDF *</label>
                <div class="input-group">
                  <input type="file" class="form-control" id="pdfInput" (change)="onFileSelected($event)"
                    accept="application/pdf">
                  <button class="btn btn-outline-secondary" type="button" [disabled]="!archivoSeleccionado"
                    (click)="limpiarArchivo()">
                    <i class="bi bi-x-circle"></i>
                  </button>
                </div>
                <small class="form-text text-muted">Solo archivos PDF (máximo 5MB)</small>
                <div *ngIf="errorArchivo" class="text-danger mt-1">{{ errorArchivo }}</div>
              </div>

              <!-- Vista previa del PDF -->
              <div *ngIf="pdfSrc" class="mb-3">
                <label class="form-label">Vista previa del PDF:</label>
                <div class="pdf-preview-container" style="height: 300px; overflow: auto; border: 1px solid #ddd;">
                  <pdf-viewer src="pdfSrc" [render-text]="true" [original-size]="false" [show-all]="true"
                    [fit-to-page]="true" style="height: 100%;">
                  </pdf-viewer>
                </div>
              </div>

              <!-- Botones de acción -->
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary" [disabled]="enviando">
                  {{ enviando ? 'Guardando...' : 'Guardar Contrato' }}
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </footer>
</div>
