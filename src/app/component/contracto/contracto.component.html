<div class="max-w-3xl mx-auto p-6 bg-white rounded-2xl shadow-lg">
  <h2 class="text-2xl font-bold mb-6 text-gray-800">📄 Crear Nuevo Contrato</h2>

  <form [formGroup]="contratoForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Número de Contrato</label>
        <input formControlName="numeroContrato" class="mt-1 block w-full border-gray-300 rounded-lg shadow-sm p-2 focus:ring focus:ring-blue-200" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Estado</label>
        <input formControlName="estado" class="mt-1 block w-full border-gray-300 rounded-lg shadow-sm p-2" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Cliente</label>
        <input formControlName="clienteNombre" class="mt-1 block w-full border-gray-300 rounded-lg shadow-sm p-2" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Cliente ID</label>
        <input type="number" formControlName="clienteId" class="mt-1 block w-full border-gray-300 rounded-lg shadow-sm p-2" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Servicio</label>
        <input formControlName="servicio" class="mt-1 block w-full border-gray-300 rounded-lg shadow-sm p-2" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Servicio ID</label>
        <input type="number" formControlName="serviciosId" class="mt-1 block w-full border-gray-300 rounded-lg shadow-sm p-2" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Empresa</label>
        <input formControlName="empresa" class="mt-1 block w-full border-gray-300 rounded-lg shadow-sm p-2" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Tipo Contrato</label>
        <input formControlName="tipoContrato" class="mt-1 block w-full border-gray-300 rounded-lg shadow-sm p-2" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Empresa Propietario</label>
        <input formControlName="empresaPropietario" class="mt-1 block w-full border-gray-300 rounded-lg shadow-sm p-2" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Fecha de Vencimiento</label>
        <input type="date" formControlName="vencimiento" class="mt-1 block w-full border-gray-300 rounded-lg shadow-sm p-2" />
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mt-4">📎 Archivos Adjuntos</label>
      <input type="file" (change)="onFileSelected($event)" multiple class="mt-1 block w-full" />
    </div>

    <button type="submit" [disabled]="isSubmitting"
      class="mt-6  font-semibold px-4 py-2 rounded-lg hover:bg-blue-700 transition">
      Guardar Contrato
    </button>
  </form>
</div>
